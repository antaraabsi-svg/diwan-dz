<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f3d6e">
<link rel="manifest" href="collage.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الرفيق في النشر">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%230f3d6e%27/%3E%3Crect x=%2712%27 y=%2712%27 width=%2719%27 height=%2724%27 rx=%274%27 fill=%27%23ff5a36%27/%3E%3Crect x=%2734%27 y=%2712%27 width=%2718%27 height=%2711%27 rx=%274%27 fill=%27%23fff%27/%3E%3Crect x=%2734%27 y=%2727%27 width=%2718%27 height=%2725%27 rx=%274%27 fill=%27%2310a88a%27/%3E%3Crect x=%2712%27 y=%2740%27 width=%2719%27 height=%2712%27 rx=%274%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<title>الرفيق في النشر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

:root{--bg:#fff4ec;--brand:#ff5a36;--navy:#0f3d6e;--blue:#1c7ed6;--mint:#d9f5ee;--teal:#10a88a;--ink:#1d1b3a;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.layout{display:flex;flex-direction:row;min-height:100vh}
aside{width:340px;background:#fff;border-radius:0 0 0 40px;padding:28px 24px;box-shadow:-6px 0 30px rgba(0,0,0,.05)}
[dir=ltr] aside{border-radius:0 0 40px 0;box-shadow:6px 0 30px rgba(0,0,0,.05)}
.brand{display:flex;align-items:center;gap:12px;background:#fff4ec;border-radius:18px;padding:12px 14px}
.brand img,.logo-fallback{width:56px;height:56px;border-radius:50%;object-fit:contain;background:#fff}
.logo-fallback{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);border:2px dashed var(--navy);font-size:11px;text-align:center}
.brand b{font-size:15px;display:block;color:var(--navy)}
.brand small{color:var(--blue);font-weight:600}
.langs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.lang{border:2px solid #ece8f4;background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.lang.on{background:var(--navy);border-color:var(--navy);color:#fff}
aside h1{font-size:28px;line-height:1.4;margin:22px 0 18px;color:var(--ink)}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;align-items:center;justify-content:space-between;background:#f3f1f7;border-radius:16px;padding:14px 16px;font-weight:600;color:#7b7890}
.step .dot{width:34px;height:34px;border-radius:50%;background:#e1deea;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.step.active{background:#ffe9e2;color:var(--ink)}.step.active .dot{background:var(--brand)}
.step.done{background:var(--mint);color:var(--ink)}.step.done .dot{background:var(--teal)}
main{flex:1;display:flex;justify-content:center;padding:36px 20px}
.panel{width:100%;max-width:520px}
.card{background:var(--card);border-radius:28px;padding:26px;box-shadow:0 10px 40px rgba(255,90,54,.1)}
h2{margin:0 0 6px;font-size:24px}.sub{color:#6e6b85;margin:0 0 20px;font-size:14px}
label{display:block;font-weight:700;margin:14px 0 6px;font-size:14px}
input[type=text],select{width:100%;padding:13px 14px;border:2px solid #ece8f4;border-radius:14px;font:inherit;background:#fcfbff}
input:focus,select:focus{outline:none;border-color:var(--brand)}
.cwrap{display:flex;gap:10px;align-items:center}.cwrap select{flex:1}
#flagPrev{width:52px;height:38px;object-fit:cover;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.25);flex:0 0 auto}
.busy{position:fixed;inset:0;background:rgba(15,61,110,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font-weight:700;z-index:50}
.spin{width:54px;height:54px;border-radius:50%;border:6px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
textarea.caption{width:100%;border:2px solid #ece8f4;font:inherit;resize:vertical;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:99px;background:#f3f1f7;cursor:pointer;font-size:13px;font-weight:600;user-select:none}
.chip.on{background:var(--navy);color:#fff}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:13px;line-height:1.7;color:#4b4866;background:#faf9fd;border-radius:14px;padding:12px}
.consent input{margin-top:5px;accent-color:var(--brand);width:18px;height:18px;flex:0 0 auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:18px;padding:16px;font:inherit;font-weight:800;font-size:17px;color:#fff;background:var(--brand);cursor:pointer;margin-top:20px;box-shadow:0 0 0 6px rgba(255,90,54,.15)}
.btn.sec{background:#fff;color:var(--ink);border:2px solid #ece8f4;box-shadow:none;margin-top:10px;font-size:15px}
.btn.navy{background:var(--navy);box-shadow:none}
.row{display:flex;gap:10px}.row .btn{margin-top:10px}
.err{color:#d6336c;font-size:13px;margin-top:6px;min-height:18px}
.hidden{display:none!important}
.gb ul,.gb ol{margin:6px 0 2px;padding-inline-start:22px}.gb li{margin:5px 0}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.thumbs div{position:relative;width:72px;height:72px}.thumbs img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.thumbs b{position:absolute;top:-7px;inset-inline-end:-7px;background:#d6336c;color:#fff;width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px;cursor:pointer;font-size:13px}
.thumbs div.sel img{outline:3px solid #ff5a36;outline-offset:2px}
.linkbtn{background:none;border:0;color:#6e6b85;text-decoration:underline;cursor:pointer;font:inherit;font-size:13px;margin-top:12px;padding:0;display:block}
.orgrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.orgrow img{width:48px;height:48px;border-radius:50%;object-fit:contain;background:#fff;border:1px solid #ddd}
.orgrow .btn{width:auto;margin-top:0;padding:12px 16px}
canvas{width:100%;border-radius:22px;background:#eee;touch-action:none;cursor:grab;display:block}
.tpls{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px}
.tpl{flex:0 0 auto;width:90px;text-align:center;font-size:12px;font-weight:700;cursor:pointer}
.tpl canvas{display:block;width:84px;height:105px;border-radius:12px;border:3px solid transparent;margin-bottom:5px;box-shadow:0 2px 8px rgba(0,0,0,.18);background:#ddd}
.tpl.on canvas{border-color:var(--brand)}
input[type=range]{width:100%;accent-color:var(--brand)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tag{background:#ffe9e2;color:#d9381a;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px}
.ok{background:var(--mint);border-radius:14px;padding:12px 14px;font-weight:700;margin:12px 0}
.caption{background:#faf9fd;border-radius:14px;padding:14px;font-size:14px;line-height:1.9;white-space:pre-wrap}
footer{text-align:center;color:#9a97ad;font-size:12px;margin-top:18px}
@media(max-width:820px){.layout{flex-direction:column}aside{width:100%;border-radius:0 0 28px 28px!important;padding:16px}
aside h1{font-size:20px;margin:14px 0 10px}.steps{flex-direction:row}.step{flex:1;padding:8px;justify-content:center;font-size:12px;gap:6px}.step .dot{width:26px;height:26px}}

.pstrip{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.pi{position:relative;width:84px}
.pi img{width:84px;height:84px;object-fit:cover;border-radius:12px;display:block}
.pi .nb{position:absolute;top:4px;inset-inline-start:4px;background:rgba(15,61,110,.85);color:#fff;border-radius:99px;min-width:22px;height:22px;text-align:center;font-size:12px;font-weight:800;line-height:22px;padding:0 5px}
.pi .ct{display:flex;justify-content:space-between;margin-top:4px}
.pi .ct button{border:0;background:#f3f1f7;border-radius:8px;width:25px;height:25px;cursor:pointer;font-size:12px;padding:0;color:var(--ink)}
.pi .ct button.x{background:#ffe3ea;color:#d6336c}
.drop{border:3px dashed #d9d4ea;border-radius:20px;padding:22px;text-align:center;color:#6e6b85;font-weight:700;cursor:pointer;background:#fcfbff}
.drop.over{border-color:var(--brand);background:#fff4ee}
.lays{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px}
.lay{flex:0 0 auto;width:74px;text-align:center;font-size:11px;font-weight:700;cursor:pointer}
.lay canvas{width:64px;height:80px;border-radius:10px;border:3px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.18);margin-bottom:4px;cursor:pointer}
.lay.on canvas{border-color:var(--brand)}
.th{flex:0 0 auto;width:72px;text-align:center;font-size:11px;font-weight:700;cursor:pointer}
.th i{display:block;width:62px;height:62px;border-radius:12px;border:3px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.18);margin:0 auto 4px}
.th.on i{border-color:var(--brand)}
.sl{display:flex;align-items:center;gap:10px;margin-top:6px}.sl span{flex:0 0 92px;font-size:13px;font-weight:700}.sl input{flex:1}
.cols2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}.cols2 input[type=color]{width:46px;height:38px;border:2px solid #ece8f4;border-radius:10px;padding:2px;background:#fff}
.selbox{background:#f6f8fc;border-radius:16px;padding:12px 14px;margin-top:12px}
.hint{background:#fff4e0;color:#7a4a00;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;margin-top:10px}
.sbtn{padding:10px 12px!important;font-size:14px!important;width:auto!important;flex:1}
#cv{cursor:default}
.gitem{margin-top:14px}.cr{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;font-weight:700;color:#6e6b85;font-size:13px}.cr a{display:flex;transition:transform .15s}.cr a:hover{transform:scale(1.12)}.hidden{display:none!important}
.sbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
</style>
</head>
<body>
<div class="layout">
<aside>
  <div class="brand">
    <img alt="logo">
    <div><b data-i="org"></b><small data-i="brandSub"></small></div>
  </div>
  
  <button type="button" class="lang hidden" id="instBtn" style="margin-top:10px;background:#e8f7ee;border-color:#8fd3a8">📲 ثبّت البرنامج على جهازك</button>
  <button type="button" class="lang" id="guideBtn" data-i="gBtn" style="margin-top:10px;background:#fff7e6;border-color:#ffcf7a"></button>
  <h1 data-i="h1"></h1>
  <div class="steps">
    <div class="step active" data-s="1"><span data-i="st1"></span><span class="dot">1</span></div>
    <div class="step" data-s="2"><span data-i="st2"></span><span class="dot">2</span></div>
    <div class="step" data-s="3"><span data-i="st3"></span><span class="dot">3</span></div>
  </div>
</aside>

<main><div class="panel" style="max-width:600px">

<section id="s1" class="card">
  <h2 data-i="c1h"></h2><p class="sub" data-i="c1sub"></p>
  <div id="resume" class="hint hidden" style="margin-bottom:10px"><span id="resTxt"></span> <button type="button" class="linkbtn" id="resYes" style="margin:0 6px">استرجاعه</button><button type="button" class="linkbtn" id="resNo" style="margin:0">حذفه</button></div>
  <div class="drop" id="drop" data-i="drop"></div>
  <input type="file" id="files" accept="image/*" multiple class="hidden">
  <div class="pstrip" id="pstrip"></div>
  <p class="sub" id="pcount" style="margin:8px 0 0;font-size:13px"></p>
  <label data-i="lTitle"></label>
  <input type="text" id="tTitle" maxlength="100" data-p="pTitle" autocomplete="off">
  <label data-i="lSub"></label>
  <input type="text" id="tSub" maxlength="90" data-p="pSub" autocomplete="off">
  <label data-i="lMode"></label>
  <div class="chips" id="tmodes"></div>
  <div id="bodyBox" class="hidden"><label data-i="lBody"></label><textarea id="tBody" rows="8" maxlength="1500" class="caption" data-p="pBody" style="background:#fcfbff"></textarea><p class="sub" id="bodyCnt" style="margin:6px 0 0;font-size:12px"></p></div>
  <div class="err" id="e1"></div>
  <button class="btn navy" id="to2" data-i="next"></button>
</section>

<section id="s2" class="card hidden">
  <h2 data-i="c2h"></h2><p class="sub" data-i="c2sub"></p>
  <canvas id="cv" width="1080" height="1350"></canvas>
  <div id="selBox" class="selbox hidden">
    <b data-i="selH" style="font-size:14px"></b>
    <div class="sl"><span data-i="lZoom"></span><input type="range" id="pZoom" min="0.25" max="4" step="0.01" value="1"></div>
    <input type="text" id="pCap" maxlength="40" placeholder="نص فوق هذه الصورة (اختياري)" autocomplete="off" style="margin-top:8px">
    <label style="margin-top:8px">تأثير ألوان لهذه الصورة</label><div class="chips" id="pfx"></div>
    <div class="sbar" style="margin-top:8px"><button class="btn sec sbtn" id="pL" style="margin-top:0">◀</button><button class="btn sec sbtn" id="pR" style="margin-top:0">▶</button><button class="btn sec sbtn" id="pRot" data-i="rot" style="margin-top:0"></button><button class="btn sec sbtn" id="pFit" style="margin-top:0">⤢ احتواء</button><button class="btn sec sbtn" id="pRst" data-i="rst" style="margin-top:0"></button><button class="btn sec sbtn" id="pDel" style="margin-top:0;color:#d6336c">🗑</button></div>
  </div>
  <p class="sub" style="margin:8px 0 0;font-size:12px" id="dragHint" data-i="dragHint"></p>
  <div id="sepWrap" class="hidden"><label data-i="lSep"></label><canvas id="cv2" width="1080" height="1350" style="cursor:default"></canvas></div>
  <label data-i="lLay"></label>
  <div class="lays" id="lays"></div>
  <div class="sbar" style="margin:-4px 0 6px"><button class="btn sec sbtn" id="allFit" style="margin-top:0">🔲 عرض الصور كاملة</button><button class="btn sec sbtn" id="allFill" style="margin-top:0">▣ ملء الخانات</button></div>
  <div class="cols2" style="margin-bottom:6px"><b style="font-size:13px">لون الفراغ حول الصورة المصغّرة</b><input type="color" id="cCell"></div>
  <label style="margin-top:4px">🎯 المنصة (يضبط المقاس والتوزيع تلقائيًا)</label>
  <div class="chips" id="plats"></div>
  <label data-i="lFmt" style="margin-top:4px"></label>
  <div class="chips" id="fmts"></div>
  <div class="hint" id="fmtHint"></div>
  <details id="txtBox" class="selbox hidden" open style="margin-top:14px"><summary data-i="lTxtFmt" style="font-weight:800;cursor:pointer"></summary>
    <div class="sl"><span data-i="tSize"></span><input type="range" id="tSize" min="60" max="170" step="5"></div>
    <div class="sl"><span data-i="tLine"></span><input type="range" id="tLine" min="1.2" max="2.4" step="0.05"></div>
    <label data-i="tAlign" style="margin-top:10px"></label><div class="chips" id="talign"></div>
    <label class="consent" style="margin-top:10px"><input type="checkbox" id="tBold"><span data-i="tBold"></span></label>
    <label class="consent" style="margin-top:8px"><input type="checkbox" id="tBul"><span data-i="tBul"></span></label>
    <div class="cols2"><b style="font-size:13px" data-i="tCol"></b><input type="color" id="tCol"><button type="button" class="linkbtn" id="tAuto" data-i="tAuto" style="margin:0"></button><b style="font-size:13px" data-i="tAcc"></b><input type="color" id="tAcc"></div>
  </details>
  <label data-i="lTheme"></label>
  <div class="lays" id="themes"></div>
  <label>الإطار الزخرفي</label><div class="chips" id="frames"></div>
  <label>نمط العنوان (بوستر)</label><div class="chips" id="pstyles"></div>
  <div class="cols2"><b style="font-size:13px">لون الإطار</b><input type="color" id="cFr"><b style="font-size:13px">لون الشريط</b><input type="color" id="cPo"></div>
  <label>✨ تأثير الألوان لكل الصور</label><div class="chips" id="fxs"></div>
  <label class="consent" style="margin-top:12px"><input type="checkbox" id="oNum"><span>ترقيم الصور (1، 2، 3…)</span></label>
  <label class="consent" style="margin-top:8px"><input type="checkbox" id="oWm"><span>وسم مائي خفيف فوق الصور</span></label>
  <div id="wmBox" class="selbox hidden"><input type="text" id="wmText" maxlength="40" placeholder="نص الوسم (افتراضيًا اسمك أو عنوانك)" autocomplete="off"><div class="chips" id="wmpos" style="margin-top:10px"></div></div>
  <label data-i="lFine"></label>
  <div class="sl"><span data-i="sGap"></span><input type="range" id="sGap" min="0" max="48" step="1"></div>
  <div class="sl"><span data-i="sMar"></span><input type="range" id="sMar" min="0" max="80" step="1"></div>
  <div class="sl"><span data-i="sRad"></span><input type="range" id="sRad" min="0" max="80" step="1"></div>
  <div class="sl"><span data-i="sBor"></span><input type="range" id="sBor" min="0" max="20" step="1"></div>
  <div class="cols2"><b style="font-size:13px" data-i="lBg"></b><input type="color" id="cBg"><label class="consent" style="margin:0;padding:6px 10px"><input type="checkbox" id="cGrad"><span data-i="grad"></span></label><input type="color" id="cBg2"><b style="font-size:13px" data-i="lBor"></b><input type="color" id="cBor"></div>
  <label class="consent" style="margin-top:12px"><input type="checkbox" id="oShadow"><span data-i="oShadow"></span></label>
  <label class="consent" style="margin-top:8px"><input type="checkbox" id="oPol"><span data-i="oPol"></span></label>
  <label class="consent" style="margin-top:8px"><input type="checkbox" id="oFoot"><span data-i="oFoot"></span></label>
  <div id="footBox" class="selbox hidden">
    <input type="text" id="fName" maxlength="70" data-p="pFname" autocomplete="off">
    <input type="text" id="fUrl" maxlength="140" data-p="pFurl" autocomplete="off" inputmode="url" dir="ltr" style="margin-top:8px;text-align:left">
    <div class="hint" data-i="hFurl" style="margin-top:6px"></div>
    <div class="orgrow" style="margin-top:10px"><img id="fLogoPrev" alt=""><button class="btn sec" id="fLogoBtn" data-i="fLogo" style="margin-top:0"></button><button class="linkbtn" id="fReset" data-i="fReset" style="margin:0"></button></div>
    <input type="file" id="fLogoFile" accept="image/*" class="hidden">
    <label data-i="lSigPos" style="margin-top:12px"></label><div class="chips" id="sigpos"></div>
    <label style="margin-top:12px">موضع كود QR</label><div class="chips" id="qrpos"></div>
    <label style="margin-top:8px">لون كود QR</label><div class="chips" id="qrcs"></div>
  </div>
  <details class="selbox" style="margin-top:14px"><summary style="font-weight:800;cursor:pointer">💾 قوالبي (هويتي وتنسيقي المفضّل)</summary>
    <p class="sub" style="margin:8px 0;font-size:13px">احفظ الهوية (اللوجو والاسم والرابط) مع التنسيق الحالي، وافتحها لاحقًا بنقرة.</p>
    <div class="orgrow"><input type="text" id="tplName" maxlength="24" placeholder="اسم القالب" autocomplete="off"><button type="button" class="btn sec" id="tplSave" style="margin-top:0">حفظ</button></div>
    <div class="chips" id="tpls" style="margin-top:10px"></div><p class="sub" id="tplMsg" style="margin:6px 0 0;font-size:12px"></p></details>
  <div class="row"><button class="btn sec" id="back1" data-i="back"></button><button class="btn" id="to3" data-i="make"></button></div>
</section>

<section id="s3" class="card hidden">
  <h2 data-i="c3h"></h2><p class="sub" data-i="c3sub"></p>
  <div id="gal"></div>
  <label style="margin-top:14px">✂️ تقسيم التصميم لأجزاء متتالية (للنشر كألبوم)</label><div class="chips" id="splits"></div>
  <label data-i="lQual" style="margin-top:14px"></label><div class="chips" id="quals"></div>
  <label data-i="lType" style="margin-top:10px"></label><div class="chips" id="types"></div>
  <div class="row"><button class="btn sec" id="back2" data-i="back2"></button><button class="btn sec" id="dl" data-i="dl"></button></div>
  <button class="btn" id="share" data-i="share"></button>
  <button class="btn sec" id="pdf">📄 تحميل PDF (صفحة لكل صورة)</button>
  <div class="ok hidden" id="msg"></div>
  <p class="sub" style="margin-top:18px" data-i="capHint"></p>

$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("caption").value)}catch(e){$("caption").select();document.execCommand("copy")}flash("copied")};

/* ---------------- guide + language ---------------- */
function renderGuide(){$("guideH").textContent=t("gTitle");$("guideX").textContent=t("gClose");$("guideBody").innerHTML=GUIDE[lang].map(([h,b])=>`<details open style="margin:8px 0;background:#f6f8fc;border-radius:14px;padding:10px 14px"><summary style="font-weight:800;cursor:pointer">${h}</summary><div class="gb">${b}</div></details>`).join("")}
$("guideBtn").onclick=()=>{renderGuide();$("guideModal").classList.remove("hidden")};$("guideX").onclick=()=>$("guideModal").classList.add("hidden");$("guideModal").onclick=e=>{if(e.target===$("guideModal"))$("guideModal").classList.add("hidden")};document.addEventListener("keydown",e=>{if(e.key==="Escape")$("guideModal").classList.add("hidden")});
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p));
  document.title=t("org");
  renderStrip();buildModes();if(!$("s2").classList.contains("hidden")){buildLays();buildFmts();buildThemes();syncTxt();buildSig();draw()}if(!$("s3").classList.contains("hidden")){buildOpts();render()}}
document.querySelector(".brand img").src=LOGO_DATA;
let dip=null;const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e;if(!isStandalone())$("instBtn").classList.remove("hidden")});
window.addEventListener("appinstalled",()=>$("instBtn").classList.add("hidden"));
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!isStandalone())$("instBtn").classList.remove("hidden");
$("instBtn").onclick=async()=>{if(dip){dip.prompt();try{await dip.userChoice}catch(e){}dip=null;$("instBtn").classList.add("hidden")}else alert("للتثبيت على الآيفون: اضغط زر المشاركة في المتصفح ثم اختر «إضافة إلى الشاشة الرئيسية».")};
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw-collage.js",{scope:"./collage.html"}).catch(()=>{});
buildTpls();checkResume();
applyTheme(0);applyLang();
if(document.fonts&&document.fonts.load){const smp="العنوان الصور Photos";Promise.all([400,600,700,800].map(w=>document.fonts.load(`${w} 30px Cairo`,smp))).then(()=>{for(const k in tcache)delete tcache[k];draw();thumbs()}).catch(()=>{})}
</script>
</body>
</html>
