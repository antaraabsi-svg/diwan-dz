<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f3d6e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الديوان">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>ديوان قطاع الشباب والرياضة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4ec;--brand:#ff5a36;--navy:#0f3d6e;--blue:#1c7ed6;--mint:#d9f5ee;--teal:#10a88a;--ink:#1d1b3a;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.layout{display:flex;flex-direction:row;min-height:100vh}
aside{width:340px;background:#fff;border-radius:0 0 0 40px;padding:28px 24px;box-shadow:-6px 0 30px rgba(0,0,0,.05)}
[dir=ltr] aside{border-radius:0 0 40px 0;box-shadow:6px 0 30px rgba(0,0,0,.05)}
.brand{display:flex;align-items:center;gap:12px;background:#fff4ec;border-radius:18px;padding:12px 14px}
.brand img,.logo-fallback{width:56px;height:56px;border-radius:50%;object-fit:contain;background:#fff}
.logo-fallback{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);border:2px dashed var(--navy);font-size:11px;text-align:center}
.brand b{font-size:15px;display:block;color:var(--navy)}
.brand small{color:var(--blue);font-weight:600}
.langs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.lang{border:2px solid #ece8f4;background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.lang.on{background:var(--navy);border-color:var(--navy);color:#fff}
aside h1{font-size:28px;line-height:1.4;margin:22px 0 18px;color:var(--ink)}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;align-items:center;justify-content:space-between;background:#f3f1f7;border-radius:16px;padding:14px 16px;font-weight:600;color:#7b7890}
.step .dot{width:34px;height:34px;border-radius:50%;background:#e1deea;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.step.active{background:#ffe9e2;color:var(--ink)}.step.active .dot{background:var(--brand)}
.step.done{background:var(--mint);color:var(--ink)}.step.done .dot{background:var(--teal)}
main{flex:1;display:flex;justify-content:center;padding:36px 20px}
.panel{width:100%;max-width:520px}
.card{background:var(--card);border-radius:28px;padding:26px;box-shadow:0 10px 40px rgba(255,90,54,.1)}
h2{margin:0 0 6px;font-size:24px}.sub{color:#6e6b85;margin:0 0 20px;font-size:14px}
label{display:block;font-weight:700;margin:14px 0 6px;font-size:14px}
input[type=text],select{width:100%;padding:13px 14px;border:2px solid #ece8f4;border-radius:14px;font:inherit;background:#fcfbff}
input:focus,select:focus{outline:none;border-color:var(--brand)}
.cwrap{display:flex;gap:10px;align-items:center}.cwrap select{flex:1}
#flagPrev{width:52px;height:38px;object-fit:cover;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.25);flex:0 0 auto}
.busy{position:fixed;inset:0;background:rgba(15,61,110,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font-weight:700;z-index:50}
.spin{width:54px;height:54px;border-radius:50%;border:6px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
textarea.caption{width:100%;border:2px solid #ece8f4;font:inherit;resize:vertical;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:99px;background:#f3f1f7;cursor:pointer;font-size:13px;font-weight:600;user-select:none}
.chip.on{background:var(--navy);color:#fff}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:13px;line-height:1.7;color:#4b4866;background:#faf9fd;border-radius:14px;padding:12px}
.consent input{margin-top:5px;accent-color:var(--brand);width:18px;height:18px;flex:0 0 auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:18px;padding:16px;font:inherit;font-weight:800;font-size:17px;color:#fff;background:var(--brand);cursor:pointer;margin-top:20px;box-shadow:0 0 0 6px rgba(255,90,54,.15)}
.btn.sec{background:#fff;color:var(--ink);border:2px solid #ece8f4;box-shadow:none;margin-top:10px;font-size:15px}
.btn.navy{background:var(--navy);box-shadow:none}
.row{display:flex;gap:10px}.row .btn{margin-top:10px}
.err{color:#d6336c;font-size:13px;margin-top:6px;min-height:18px}
.hidden{display:none!important}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.thumbs div{position:relative;width:72px;height:72px}.thumbs img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.thumbs b{position:absolute;top:-7px;inset-inline-end:-7px;background:#d6336c;color:#fff;width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px;cursor:pointer;font-size:13px}
.thumbs div.sel img{outline:3px solid #ff5a36;outline-offset:2px}
.linkbtn{background:none;border:0;color:#6e6b85;text-decoration:underline;cursor:pointer;font:inherit;font-size:13px;margin-top:12px;padding:0;display:block}
.orgrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.orgrow img{width:48px;height:48px;border-radius:50%;object-fit:contain;background:#fff;border:1px solid #ddd}
.orgrow .btn{width:auto;margin-top:0;padding:12px 16px}
canvas{width:100%;border-radius:22px;background:#eee;touch-action:none;cursor:grab;display:block}
.tpls{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px}
.tpl{flex:0 0 auto;width:90px;text-align:center;font-size:12px;font-weight:700;cursor:pointer}
.tpl canvas{display:block;width:84px;height:105px;border-radius:12px;border:3px solid transparent;margin-bottom:5px;box-shadow:0 2px 8px rgba(0,0,0,.18);background:#ddd}
.tpl.on canvas{border-color:var(--brand)}
input[type=range]{width:100%;accent-color:var(--brand)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tag{background:#ffe9e2;color:#d9381a;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px}
.ok{background:var(--mint);border-radius:14px;padding:12px 14px;font-weight:700;margin:12px 0}
.caption{background:#faf9fd;border-radius:14px;padding:14px;font-size:14px;line-height:1.9;white-space:pre-wrap}
footer{text-align:center;color:#9a97ad;font-size:12px;margin-top:18px}
@media(max-width:820px){.layout{flex-direction:column}aside{width:100%;border-radius:0 0 28px 28px!important;padding:16px}
aside h1{font-size:20px;margin:14px 0 10px}.steps{flex-direction:row}.step{flex:1;padding:8px;justify-content:center;font-size:12px;gap:6px}.step .dot{width:26px;height:26px}}
</style>
</head>
<body>
<div class="layout">
<aside>
  <div class="brand">
    <img alt="logo">
    <div><b data-i="org"></b><small data-i="brandSub"></small></div>
  </div>
  <div class="langs" id="langs"></div>
  <h1 data-i="h1"></h1>
  <div class="steps">
    <div class="step active" data-s="1"><span data-i="st1"></span><span class="dot">1</span></div>
    <div class="step" data-s="2"><span data-i="st2"></span><span class="dot">2</span></div>
    <div class="step" data-s="3"><span data-i="st3"></span><span class="dot">3</span></div>
  </div>
</aside>

<main><div class="panel">

<section id="s1" class="card">
  <div class="ok hidden" id="hint"><span data-i="hintTxt"></span><br><button type="button" class="linkbtn" id="hintOk" data-i="hintOk" style="margin-top:6px"></button></div>
  <h2 data-i="c1h"></h2><p class="sub" data-i="c1sub"></p>
  <label data-i="lMode" style="margin-top:0"></label><div class="chips" id="modes"></div>
  <label data-i="lName" id="lblName"></label><input type="text" id="fName" maxlength="70" data-p="pName">
  <label data-i="lCountry"></label>
  <div class="cwrap"><select id="fCountry"></select><img id="flagPrev" alt="" class="hidden"></div>
  <div id="wilayaWrap"><label data-i="lWilaya"></label><select id="fWilaya"></select></div>
  <div id="personalFields">
  <label data-i="lAge"></label><select id="fAge"></select>
  <label data-i="lGender"></label><select id="fGender"></select>
  <label data-i="lRole"></label><div class="chips" id="roles"></div>
  <input type="text" id="fOther" maxlength="60" class="hidden" data-p="pOther" style="margin-top:10px">
  <label data-i="lWork"></label><input type="text" id="fWork" maxlength="90" data-p="pWork">
  </div>
  <label data-i="lEvent"></label><input type="text" id="fEvent" maxlength="70" data-p="pEvent">
  <label data-i="lOrgLogo"></label>
  <div class="orgrow"><button type="button" class="btn sec" id="orgPick" data-i="orgLogoPick"></button><img id="orgPrev" class="hidden" alt=""><button type="button" class="btn sec hidden" id="orgDel" data-i="orgLogoDel"></button></div>
  <input type="file" id="orgFile" accept="image/*" class="hidden">
  <label data-i="lSlogan"></label><select id="fSlogan"></select>
  <label data-i="lCustom"></label><input type="text" id="fCustom" maxlength="80" data-p="pCustom">
  <div class="ok" style="font-weight:600;font-size:13px;line-height:1.7" data-i="privacy"></div>
  <label class="consent"><input type="checkbox" id="fConsent"><span data-i="consent"></span></label>
  <div class="err" id="e1"></div>
  <button class="btn" id="to2" data-i="next"></button>
  <button type="button" class="linkbtn" id="clearProf" data-i="clearProfile"></button>
  <button type="button" class="btn sec hidden" id="installBtn" data-i="installApp" style="margin-top:14px"></button>
  <div class="ok hidden" id="iosHint" style="font-size:13px;margin-top:14px" data-i="iosHint"></div>
</section>

<section id="s2" class="card hidden">
  <h2 data-i="c2h"></h2><p class="sub" data-i="c2sub"></p>
  <label style="margin-top:0" data-i="lTpl"></label>
  <div class="tpls" id="tpls"></div>
  <canvas id="cv" width="1080" height="1350"></canvas>
  <div id="zoomWrap"><label data-i="lZoom"></label><input type="range" id="zoom" min="1" max="3" step="0.01" value="1"></div>
  <label data-i="lStk"></label><div class="chips" id="stkChips"></div>
  <div class="row hidden" id="stkCtl"><button class="btn sec" id="stkBig" style="padding:10px">＋</button><button class="btn sec" id="stkSmall" style="padding:10px">－</button><button class="btn sec" id="stkDel" style="padding:10px">🗑</button></div>
  <p class="sub" style="margin:6px 0 0;font-size:12px" data-i="stkHint"></p>
  <div id="txtCtl">
    <label data-i="lTxt"></label>
    <label class="consent" style="margin:6px 0"><input type="checkbox" id="txtShow" checked><span data-i="txtShow"></span></label>
    <div class="chips" id="txtColors"></div>
    <div class="row" style="margin-top:8px"><button class="btn sec" id="txtUp" style="padding:10px">▲</button><button class="btn sec" id="txtDn" style="padding:10px">▼</button><button class="btn sec" id="txtBig" style="padding:10px">＋</button><button class="btn sec" id="txtSmall" style="padding:10px">－</button><button class="btn sec" id="txtRst" style="padding:10px" data-i="txtReset"></button></div>
    <label class="consent" id="txtGradRow" style="margin:8px 0 0"><input type="checkbox" id="txtGrad" checked><span data-i="txtGrad"></span></label>
    <button type="button" class="linkbtn" id="txtEdit" data-i="txtEdit"></button>
    <p class="sub" style="margin:6px 0 0;font-size:12px" data-i="txtHint"></p>
  </div>
  <label class="consent" style="margin-top:12px"><input type="checkbox" id="enh"><span data-i="enh"></span></label>
  <input type="file" id="file" accept="image/*" class="hidden">
  <input type="file" id="teamFile" accept="image/*" multiple class="hidden">
  <div id="teamBox" class="hidden"><button class="btn" id="teamAdd" data-i="teamAdd"></button><p class="sub" style="margin:8px 0 0" data-i="teamHint"></p><div class="thumbs" id="teamThumbs"></div></div>
  <div class="row" id="soloRow"><button class="btn" id="pick"></button><button class="btn sec hidden" id="lastBtn" data-i="lastPhoto" style="flex:0 0 auto;width:auto;padding:16px 20px;margin-top:20px"></button><button class="btn sec" id="rotBtn" data-i="rot" style="flex:0 0 auto;width:auto;padding:16px 20px;margin-top:20px"></button></div>
  <div class="err" id="e2"></div>
  <div class="row"><button class="btn sec" id="back1" data-i="back"></button><button class="btn navy" id="to3" data-i="make"></button></div>
</section>

<section id="s3" class="card hidden">
  <h2 data-i="c3h"></h2><p class="sub" data-i="c3sub"></p>
  <img id="result" style="width:100%;border-radius:22px;cursor:zoom-in" alt="">
  <label data-i="lFormat" style="margin-top:14px"></label><div class="chips" id="fmts"></div>
  <div class="row"><button class="btn sec" id="back2" data-i="back2"></button><button class="btn sec" id="dl" data-i="dl"></button></div>
  <button class="btn" id="share" data-i="share"></button>
  <button class="btn sec hidden" id="copyImg" data-i="copyImg"></button>
  <button class="btn navy" id="openGroup" data-i="openGroup"></button>
  <button class="btn sec" id="newBtn" data-i="newBtn"></button>
  <div class="ok hidden" id="msg"></div>
  <p class="sub" style="margin-top:18px" data-i="postHint"></p>
  <div class="tags" id="tags"></div>
  <p class="sub" style="margin:0 0 6px" data-i="capEdit"></p>
  <textarea class="caption" id="caption" rows="6"></textarea>
  <button class="btn sec" id="capNext" data-i="capNext"></button>
  <button class="btn sec" id="copy" data-i="copy"></button>
</section>

<footer data-i="foot"></footer>
<div id="lightbox" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:60;display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-out"><img id="lbImg" style="max-width:100%;max-height:100%;border-radius:12px" alt=""></div>
<div class="busy hidden" id="busy"><div class="spin"></div><p data-i="busy"></p></div>
</div></main>
</div>

const $=id=>document.getElementById(id);
document.querySelector(".brand img").src=LOGO_DATA;
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()};
let lang=(()=>{try{const v=localStorage.getItem("diwan_lang");return["ar","fr","en"].includes(v)?v:"ar"}catch(e){return"ar"}})();
const t=k=>L[lang][k];
const data={mode:"solo",event:"",country:"DZ",otherRole:"",custom:"",name:"",wil:-1,age:-1,gender:-1,roles:[],work:"",slogan:-1};
let tpl=0,manualTpl=false;
let orgLogo=null,orgData="";const timgs=[];let tsel=0,cellRects=[];
const PROF="diwan_profile";
const selRoles=new Set();

function buildCountries(){
  const cur=$("fCountry").value||data.country||"DZ";
  const list=CODES.filter(c=>c!=="DZ").map(c=>[c,cname(c)]).sort((a,b)=>a[1].localeCompare(b[1],lang));
  list.unshift(["DZ",cname("DZ")]);
  $("fCountry").innerHTML=list.map(([c,n])=>`<option value="${c}">${flagEmoji(c)}  ${n}</option>`).join("");
  $("fCountry").value=cur;syncCountry();
}
function syncCountry(){
  const c=$("fCountry").value||"DZ";data.country=c;
  $("wilayaWrap").classList.toggle("hidden",c!=="DZ");
  const fp=$("flagPrev");fp.classList.remove("hidden");fp.onerror=()=>fp.classList.add("hidden");fp.onload=()=>fp.classList.remove("hidden");fp.src=flagUrl(c);
}
function build(){
  buildCountries();
  const wv=$("fWilaya").value,av=$("fAge").value,sv=$("fSlogan").value,gv=$("fGender").value;
  $("fWilaya").innerHTML=`<option value="">${t("pickW")}</option>`+WAR.map((w,i)=>`<option value="${i}">${String(i+1).padStart(2,"0")} - ${wname(i)}</option>`).join("");
  $("fAge").innerHTML=`<option value="">${t("pickAge")}</option>`+AGES.map((a,i)=>`<option value="${i}">${a[lang]}</option>`).join("");
  $("fGender").innerHTML=`<option value="">${t("pickAge")}</option>`+GENDERS.map((g,i)=>`<option value="${i}">${g[lang]}</option>`).join("");
  $("fSlogan").innerHTML=`<option value="">${t("noSlogan")}</option>`+SLOGANS.map((s,i)=>`<option value="${i}">${sloganTxt(s)}</option>`).join("");
  $("fWilaya").value=wv;$("fAge").value=av;$("fSlogan").value=sv;$("fGender").value=gv;
  $("roles").innerHTML=ROLES.map((r,i)=>`<span class="chip${selRoles.has(i)?" on":""}" data-i="${i}">${r[lang]}</span>`).join("");
  $("tpls").innerHTML=TPLS.map((x,i)=>`<div class="tpl${i===tpl?" on":""}" data-i="${i}"><canvas width="168" height="210"></canvas>${tplName(x)}</div>`).join("");
  $("fOther").classList.toggle("hidden",!selRoles.has(OTHER));
  $("tags").innerHTML=CONFIG.HASHTAGS.map(h=>`<span class="tag">${h}</span>`).join("");
}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  syncMode();
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p));
  if(typeof buildFormats==="function")buildFormats();
  $("langs").innerHTML=LANGS.map(([k,n])=>`<button class="lang${k===lang?" on":""}" data-l="${k}">${n}</button>`).join("");
  $("pick").textContent=img?t("pick2"):t("pick");
  build();draw();renderThumbs();
  if(blob)setCap();
}
const isTeam=()=>data.mode==="team";
function syncMode(){
  try{lastUI()}catch(e){}
  stkUI();
  const tm=isTeam();
  $("lblName").dataset.i=tm?"lNameTeam":"lName";$("fName").dataset.p=tm?"pNameTeam":"pName";
  $("personalFields").classList.toggle("hidden",tm);
  $("modes").innerHTML=[["solo","modeSolo"],["team","modeTeam"]].map(([k,n])=>`<span class="chip${k===data.mode?" on":""}" data-m="${k}">${t(n)}</span>`).join("");
  $("pick").classList.toggle("hidden",tm);$("teamBox").classList.toggle("hidden",!tm);
  drawTeamThumbs();
}
function drawTeamThumbs(){
  if(tsel>=timgs.length)tsel=Math.max(0,timgs.length-1);
  $("teamThumbs").innerHTML=timgs.map((im,i)=>`<div data-s="${i}" class="${i===tsel&&timgs.length>1?"sel":""}"><img src="${im.src}" alt=""><b data-k="${i}">×</b></div>`).join("");
  $("teamAdd").style.display=timgs.length>=4?"none":"";
}
$("modes").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;data.mode=c.dataset.m;applyLang()};
$("teamAdd").onclick=()=>$("teamFile").click();
$("teamFile").onchange=e=>{
  const fs=[...e.target.files].slice(0,4-timgs.length);e.target.value="";
  fs.forEach(f=>{const i=new Image();i.onload=()=>{if(timgs.length<4){i._z=1;i._r=0;i._ox=0;i._oy=0;timgs.push(i);tsel=timgs.length-1;$("zoom").value=1;$("e2").textContent="";drawTeamThumbs();draw();renderThumbs()}};i.src=URL.createObjectURL(f)});
};
$("teamThumbs").onclick=e=>{const b=e.target.closest("b");
  if(b){timgs.splice(+b.dataset.k,1);drawTeamThumbs();$("zoom").value=getZ();draw();renderThumbs();return}
  const d=e.target.closest("div[data-s]");if(d){tsel=+d.dataset.s;drawTeamThumbs();$("zoom").value=getZ();draw()}};

/* شعار الجمعية */
function setOrgLogo(im,url){orgLogo=im;orgData=url||"";const pv=$("orgPrev");
  if(im){pv.src=url;pv.classList.remove("hidden");$("orgDel").classList.remove("hidden")}else{pv.removeAttribute("src");pv.classList.add("hidden");$("orgDel").classList.add("hidden")}
  draw();renderThumbs()}
$("orgPick").onclick=()=>$("orgFile").click();
$("orgDel").onclick=()=>setOrgLogo(null,"");
$("orgFile").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  const i=new Image();i.onload=()=>{const m=256,k=Math.min(m/i.width,m/i.height,1),c=document.createElement("canvas");c.width=Math.max(1,Math.round(i.width*k));c.height=Math.max(1,Math.round(i.height*k));
    c.getContext("2d").drawImage(i,0,0,c.width,c.height);let u="";try{u=c.toDataURL("image/png")}catch(x){}setOrgLogo(c,u)};i.src=URL.createObjectURL(f)};

/* تذكّر البيانات على الجهاز */
function saveProfile(){try{localStorage.setItem(PROF,JSON.stringify({name:data.name,country:data.country,wil:data.wil,age:data.age,gender:data.gender,roles:data.roles,otherRole:data.otherRole,work:data.work,slogan:data.slogan,custom:data.custom,org:orgData.length<400000?orgData:""}))}catch(e){}}
function loadProfile(){
  let p=null;try{p=JSON.parse(localStorage.getItem(PROF)||"null")}catch(e){}
  if(!p)return;
  if(typeof p.name==="string")$("fName").value=p.name;
  if(p.country&&CODES.includes(p.country)){$("fCountry").value=p.country;syncCountry()}
  const sv=(id,v)=>{if(v!==undefined&&v!==null&&v>=0)$(id).value=v};
  sv("fWilaya",p.wil);sv("fAge",p.age);sv("fGender",p.gender);sv("fSlogan",p.slogan);
  data.gender=$("fGender").value===""?-1:+$("fGender").value;
  selRoles.clear();(p.roles||[]).forEach(r=>{if(ROLES[r])selRoles.add(r)});
  $("fOther").value=p.otherRole||"";$("fWork").value=p.work||"";$("fCustom").value=p.custom||"";
  build();
  if(typeof p.org==="string"&&p.org.startsWith("data:image/")){const i=new Image();i.onload=()=>setOrgLogo(i,p.org);i.src=p.org}
}
$("clearProf").onclick=()=>{try{localStorage.removeItem(PROF);localStorage.removeItem("diwan_lastphoto")}catch(e){}
  ["fName","fWork","fOther","fCustom","fAge","fGender","fSlogan","fWilaya"].forEach(id=>$(id).value="");selRoles.clear();
  $("fCountry").value="DZ";syncCountry();data.gender=-1;setOrgLogo(null,"");build();$("e1").textContent=t("msgCleared")};
$("langs").onclick=e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;try{localStorage.setItem("diwan_lang",lang)}catch(x){}applyLang()};
$("fCountry").onchange=()=>{syncCountry();draw()};
$("fGender").onchange=()=>{data.gender=$("fGender").value===""?-1:+$("fGender").value;build();draw()};
$("roles").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;const i=+c.dataset.i;selRoles.has(i)?selRoles.delete(i):selRoles.add(i);c.classList.toggle("on");syncOther()};
function syncOther(){$("fOther").classList.toggle("hidden",!selRoles.has(OTHER));if(selRoles.has(OTHER)&&!$("fOther").value)$("fOther").focus()}
$("tpls").onclick=e=>{const c=e.target.closest(".tpl");if(!c)return;tpl=+c.dataset.i;manualTpl=true;
  document.querySelectorAll(".tpl").forEach(x=>x.classList.toggle("on",x===c));draw()};

function go(n){

  if(im2)ctx.drawImage(im2,0,0,W,H);

function scene(c,ti,sc){

  else if(T.layout==="poster"){posterBack(T);header(T);posterFront(T);eventRibbon(T)}
  else if(T.layout==="polaroid"){header(T);polaroid(T);eventRibbon(T)}
  else if(T.layout==="ribbon"){header(T);frame(T);eventRibbon(T);txtT(1164,{x:40,y:1000,w:1000,h:330},()=>{ribbonPlate(T);texts(T)})}

}

  else if(ptrs.size===2){const [p,q]=[...ptrs.values()];pinch={d:Math.hypot(p.x-q.x,p.y-q.y)||1,z:getZ()};drag=null}});
cv.addEventListener("pointermove",e=>{
  if(tdrag){const k=kk();txt.dx=Math.max(-500,Math.min(500,tdrag.dx+(e.clientX-tdrag.x)*k));txt.dy=Math.max(-700,Math.min(400,tdrag.dy+(e.clientY-tdrag.y)*k));draw();return}
  if(sdrag){const o=stks[sdrag.i],k=kk();o.x=Math.max(30,Math.min(1050,sdrag.sx+(e.clientX-sdrag.x)*k));o.y=Math.max(150,Math.min(1300,sdrag.sy+(e.clientY-sdrag.y)*k));draw();return}
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch){const [p,q]=[...ptrs.values()];setZoom(pinch.z*Math.hypot(p.x-q.x,p.y-q.y)/pinch.d)}
  else if(drag&&ptrs.size===1){setO(drag.ox+(e.clientX-drag.x)*kk(),drag.oy+(e.clientY-drag.y)*kk());draw()}});
const endPtr=e=>{if(tdrag){tdrag=null;renderThumbs();return}if(sdrag){sdrag=null;renderThumbs();return}ptrs.delete(e.pointerId);pinch=null;drag=null;if(ptrs.size===1){const [p]=[...ptrs.values()],[a,b]=getO();drag={x:p.x,y:p.y,ox:a,oy:b}}cv.style.cursor="grab";renderThumbs()};
["pointerup","pointercancel"].forEach(ev=>cv.addEventListener(ev,endPtr));

function blurStretch(k,src,sx,sy,sw,sh,tw,th,dx,dy,dw,dh){const t=document.createElement("canvas");t.width=tw;t.height=th;t.getContext("2d").drawImage(src,sx,sy,sw,sh,0,0,tw,th);k.drawImage(t,0,0,tw,th,dx,dy,dw,dh)}
function composeFormat(){
  if(fmt==="45")return art;
  const OW=2160,OH=fmt==="11"?2160:3840,out=document.createElement("canvas");out.width=OW;out.height=OH;
  const k=out.getContext("2d");k.imageSmoothingEnabled=true;k.imageSmoothingQuality="high";
  if(fmt==="11"){const sc=OH/art.height,aw=art.width*sc,ax=(OW-aw)/2;
    blurStretch(k,art,0,0,8,art.height,2,24,0,0,ax+3,OH);blurStretch(k,art,art.width-8,0,8,art.height,2,24,ax+aw-3,0,ax+3,OH);k.drawImage(art,ax,0,aw,OH)}
  else{const ay=(OH-art.height)/2;
    blurStretch(k,art,0,0,art.width,8,24,2,0,0,OW,ay+3);blurStretch(k,art,0,art.height-8,art.width,8,24,2,0,ay+art.height-3,OW,ay+3);k.drawImage(art,0,ay)}
  return out}
